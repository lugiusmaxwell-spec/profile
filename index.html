<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugius Maxwell</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-glass: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #dddddd;
            --border-glass: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-hover: rgba(255, 255, 255, 0.25);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body.light-mode {
            --bg-glass: rgba(255, 255, 255, 0.7);
            --text-main: #1d1d1f;
            --text-sub: #515154;
            --border-glass: rgba(0, 0, 0, 0.1);
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-hover: rgba(0, 0, 0, 0.15);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: var(--text-main);
            transition: var(--transition);
            cursor: pointer;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background-color: #000;
        }

        .video-background::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7));
            z-index: 1;
            transition: var(--transition);
        }

        body.light-mode .video-background::after {
            background: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.6));
        }

        .video-background video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        #bg-video-light { display: none; }
        body.light-mode #bg-video-dark { display: none; }
        body.light-mode #bg-video-light { display: block; }

        .container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: fadeUp 1s ease-out;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-glass);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .avatar:hover { transform: scale(1.05); }

        h1 { font-size: 26px; font-weight: 700; margin-bottom: 5px; letter-spacing: 0.5px; }
        .roles { font-size: 14px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; font-weight: 600; }
        .slogan { font-size: 16px; font-style: italic; margin-bottom: 30px; min-height: 24px; font-weight: 300; }
        .links { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            background: var(--btn-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid var(--border-glass);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn:hover { background: var(--btn-hover); transform: scale(1.02); }
        .btn i { font-size: 18px; }

        .top-controls {
            position: absolute;
            top: 20px;
            width: 100%;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .clock {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .theme-toggle, .audio-toggle {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            transition: var(--transition);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover, .audio-toggle:hover {
            transform: scale(1.1);
            background: var(--btn-hover);
        }

        .controls-right { display: flex; gap: 15px; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #particle-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 5; }
    </style>
</head>
<body onclick="playAudio()">

    <!-- ĐÂY LÀ VÍ DỤ LINK TRỰC TUYẾN -->
    <div class="video-background">
        <!-- Video Tối: Bầu trời đêm (Link mẫu) -->
        <video autoplay loop muted playsinline id="bg-video-dark">
            <source src="./bg-dark.mp4" type="video/mp4">
        </video>
        
        <!-- Video Sáng: Mây trời (Link mẫu) -->
        <video autoplay loop muted playsinline id="bg-video-light">
            <source src="./bg-light.mp4" type="video/mp4">
        </video>
    </div>

    <canvas id="particle-canvas"></canvas>

    <div class="top-controls">
        <div class="clock" id="clock">00:00:00</div>
        <div class="controls-right">
            <button class="audio-toggle" id="audioBtn" title="Bật/Tắt âm thanh">
                <i class="fa-solid fa-volume-xmark"></i>
            </button>
            <button class="theme-toggle" id="themeBtn" title="Đổi giao diện">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </div>

    <div class="container">
        <div class="profile-card">
            <img src="./avatar.jpg" alt="Lugius Maxwell" class="avatar">
            
            <h1>Lugius Maxwell</h1>
            <div class="roles">MOD | FREELANCER | STUDENT</div>
            
            <p class="slogan" id="typewriter"></p>

            <div class="links">
                <a href="https://discord.gg/Ku7x8T3X2r" target="_blank" class="btn" style="color: #5865F2;">
                    <i class="fa-brands fa-discord"></i> Discord Server
                </a>
                <a href="https://youtube.com/@keoholo-9012" target="_blank" class="btn" style="color: #FF0000;">
                    <i class="fa-brands fa-youtube"></i> YouTube
                </a>
                <a href="https://www.facebook.com/share/18f9yC67Hi/" target="_blank" class="btn" style="color: #1877F2;">
                    <i class="fa-brands fa-facebook"></i> Facebook
                </a>
            </div>
        </div>
    </div>

    <script>
        const videoDark = document.getElementById('bg-video-dark');
        const videoLight = document.getElementById('bg-video-light');

        function getActiveVideo() {
            return document.body.classList.contains('light-mode') ? videoLight : videoDark;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('vi-VN', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();

        const text = '"Live and do what you want while you still can."';
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            }
        }
        setTimeout(typeWriter, 1000);

        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = themeBtn.querySelector('i');
        
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
            videoDark.pause();
            videoLight.play();
        }

        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            document.body.classList.toggle('light-mode');
            
            if (document.body.classList.contains('light-mode')) {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('theme', 'light');
                videoDark.pause();
                videoLight.muted = videoDark.muted;
                videoLight.play();
            } else {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('theme', 'dark');
                videoLight.pause();
                videoDark.muted = videoLight.muted;
                videoDark.play();
            }
        });

        const audioBtn = document.getElementById('audioBtn');
        const audioIcon = audioBtn.querySelector('i');
        let isMuted = true;

        function playAudio() {
            if (isMuted) {
                getActiveVideo().muted = false;
                isMuted = false;
                audioIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
            }
        }

        audioBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const activeVideo = getActiveVideo();
            activeVideo.muted = !activeVideo.muted;
            isMuted = activeVideo.muted;
            
            if (isMuted) {
                audioIcon.classList.replace('fa-volume-high', 'fa-volume-xmark');
            } else {
                audioIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
            }
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                Swal.fire({
                    title: 'Chào mừng!',
                    text: 'Nhấn vào màn hình để bật âm thanh (nếu có).',
                    icon: 'info',
                    background: document.body.classList.contains('light-mode') ? '#fff' : '#1c1c1e',
                    color: document.body.classList.contains('light-mode') ? '#000' : '#fff',
                    confirmButtonColor: '#0071e3',
                    confirmButtonText: 'OK',
                    backdrop: `rgba(0,0,0,0.4)`
                });
            }, 500);
        });

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y > canvas.height) { this.y = 0; this.x = Math.random() * canvas.width; }
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                if (document.body.classList.contains('light-mode')) {
                    ctx.fillStyle = `rgba(0, 0, 0, ${this.opacity})`;
                }
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) { particles.push(new Particle()); }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
